<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>Edit profile</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form (ngSubmit)="editUser()">
      <mat-form-field>
        <input
          matInput
          [(ngModel)]="userProfile.Username"
          placeholder="Username"
          type="text"
          name="Username"
          required
        />
      </mat-form-field>
      <mat-form-field>
        <input
          matInput
          [(ngModel)]="userProfile.Password"
          placeholder="New password (leave blank to keep)"
          type="password"
          name="Password"
          autocomplete="new-password"
        />
      </mat-form-field>
      <mat-form-field>
        <input
          matInput
          [(ngModel)]="userProfile.Email"
          placeholder="Email"
          type="email"
          name="Email"
          required
        />
      </mat-form-field>
      <mat-form-field>
        <input
          matInput
          [(ngModel)]="userProfile.Birthday"
          placeholder="Birthday"
          type="date"
          name="Birthday"
        />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">Save changes</button>
    </form>
  </mat-card-content>
</mat-card>
