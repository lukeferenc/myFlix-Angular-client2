<mat-card class="auth-card dialog-card">
  <mat-card-header>
    <mat-card-title>Delete profile</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>This removes your account and favourites. It can’t be undone.</p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-stroked-button type="button" mat-dialog-close>Cancel</button>
    <button mat-raised-button color="warn" type="button" (click)="deleteUser()">
      Delete
    </button>
  </mat-card-actions>
</mat-card>
