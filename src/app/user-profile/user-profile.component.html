<app-nav-menu></app-nav-menu>

<section class="profile">
  <header class="profile__header">
    <p class="profile__eyebrow">Account</p>
    <h1>Hey, {{ user.Username }}</h1>
  </header>

  <mat-card class="profile-card">
    <mat-card-content>
      <p><span>Username</span>{{ user.Username }}</p>
      <p><span>Email</span>{{ user.Email }}</p>
      <p><span>Birthday</span>{{ user.Birthday || '—' }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" type="button" (click)="openEditUserDialog()">
        Edit profile
      </button>
      <button mat-stroked-button color="warn" type="button" (click)="openDeleteUserDialog()">
        Delete profile
      </button>
    </mat-card-actions>
  </mat-card>

  <h2 class="profile__fav-title">Favourite films</h2>
  <p class="profile__empty" *ngIf="!FavouriteMovies.length">
    No favourites yet — tap the heart on any poster in Films.
  </p>
  <div class="favorites-grid">
    <article class="fav-card" *ngFor="let favourite of FavouriteMovies">
      <img [src]="favourite.ImagePath" [alt]="favourite.Title" loading="lazy" />
      <div class="fav-card__meta">
        <h3>{{ favourite.Title }}</h3>
        <p>{{ favourite.Director.Name }}</p>
      </div>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'Remove ' + favourite.Title + ' from favourites'"
        (click)="deleteFavouriteMovie(favourite)"
      >
        <mat-icon>remove_circle</mat-icon>
      </button>
    </article>
  </div>
</section>
