<div class="welcome">
  <div class="welcome__atmosphere" aria-hidden="true"></div>
  <header class="welcome__brand">
    <span class="brand">my<em>Flix</em></span>
  </header>
  <main class="welcome__hero">
    <p class="welcome__eyebrow">Your movie shelf</p>
    <h1>Find the next film.<br />Keep the favorites.</h1>
    <p class="welcome__lede">
      Browse the catalog, open directors and genres, and build a list that actually feels like yours.
    </p>
    <div class="welcome__actions">
      <button mat-raised-button color="primary" class="welcome__cta" (click)="openUserLoginDialog()">
        Login
      </button>
      <button mat-stroked-button class="welcome__ghost" (click)="openUserRegistrationDialog()">
        Sign up
      </button>
    </div>
  </main>
</div>
