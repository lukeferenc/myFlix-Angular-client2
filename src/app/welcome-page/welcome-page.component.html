<div class="welcome">
  <header class="welcome__nav">
    <a class="brand" href="#" (click)="$event.preventDefault()">
      <span class="brand__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      myFlix
    </a>
    <nav class="welcome__links">
      <button type="button" (click)="openUserLoginDialog()">Sign in</button>
      <button type="button" (click)="openUserRegistrationDialog()">Create account</button>
    </nav>
  </header>

  <main class="welcome__hero">
    <h1>
      Track films you’ve watched.<br />
      Save those you want to see.
    </h1>
    <button mat-raised-button color="primary" class="welcome__cta" (click)="openUserRegistrationDialog()">
      Get started — it’s free!
    </button>
    <p class="welcome__note">Your personal film diary. Browse the catalog, mark favorites, dig into directors and genres.</p>
  </main>
</div>
