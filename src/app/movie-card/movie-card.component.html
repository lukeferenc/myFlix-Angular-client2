<app-nav-menu></app-nav-menu>

<section class="catalog">
  <header class="catalog__header">
    <div>
      <p class="catalog__eyebrow">Catalog</p>
      <h1 class="catalog__title">All movies</h1>
    </div>
    <p class="catalog__count" *ngIf="movies?.length">{{ movies.length }} titles</p>
  </header>

  <div class="movie-grid">
    <article class="poster-card" *ngFor="let movie of movies">
      <div class="poster-card__media">
        <img [src]="movie.ImagePath" [alt]="movie.Title" loading="lazy" />
        <button
          class="poster-card__fav"
          mat-icon-button
          type="button"
          [attr.aria-label]="isFavorite(movie._id) ? 'Remove from favorites' : 'Add to favorites'"
          (click)="toggleFavorite(movie)"
        >
          <mat-icon *ngIf="!isFavorite(movie._id)">favorite_border</mat-icon>
          <mat-icon *ngIf="isFavorite(movie._id)" class="is-fav">favorite</mat-icon>
        </button>
        <div class="poster-card__shade"></div>
      </div>
      <div class="poster-card__body">
        <h2 class="poster-card__title">{{ movie.Title }}</h2>
        <p class="poster-card__meta">{{ movie.Director.Name }}</p>
        <div class="poster-card__actions">
          <button mat-button type="button" (click)="openGenreCard(movie.Genre.Name, movie.Genre.Description)">
            Genre
          </button>
          <button mat-button type="button" (click)="openDirectorCard(movie.Director.Name, movie.Director.Bio)">
            Director
          </button>
          <button mat-button type="button" (click)="openMovieView(movie.Title, movie.Description)">
            Info
          </button>
        </div>
      </div>
    </article>
  </div>
</section>
