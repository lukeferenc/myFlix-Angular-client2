<app-nav-menu></app-nav-menu>

<section class="catalog">
  <header class="catalog__header">
    <h1 class="catalog__title">Popular films</h1>
    <p class="catalog__count" *ngIf="movies.length">
      {{ filteredMovies.length }}<ng-container *ngIf="filteredMovies.length !== movies.length"> of {{ movies.length }}</ng-container> titles
    </p>
  </header>

  <div class="filters" *ngIf="movies.length">
    <label class="filters__search">
      <mat-icon aria-hidden="true">search</mat-icon>
      <input
        type="search"
        placeholder="Search titles or directors"
        aria-label="Search titles or directors"
        [(ngModel)]="search"
        (ngModelChange)="applyFilters()"
      />
    </label>
    <div class="filters__genres" role="group" aria-label="Filter by genre">
      <button
        type="button"
        class="chip"
        [class.chip--active]="!activeGenre"
        (click)="setGenre(null)"
      >All</button>
      <button
        type="button"
        class="chip"
        *ngFor="let genre of genres"
        [class.chip--active]="activeGenre === genre"
        [attr.aria-pressed]="activeGenre === genre"
        (click)="setGenre(genre)"
      >{{ genre }}</button>
    </div>
  </div>

  <p class="catalog__status" *ngIf="loading">Loading films…</p>

  <div class="catalog__empty" *ngIf="!loading && movies.length && !filteredMovies.length">
    <p>No films match that.</p>
    <button type="button" class="chip" (click)="clearFilters()">Clear filters</button>
  </div>

  <div class="movie-grid">
    <article class="poster-card" *ngFor="let movie of filteredMovies">
      <div class="poster-card__media">
        <img [src]="movie.ImagePath" [alt]="movie.Title" loading="lazy" />
        <button
          class="poster-card__fav"
          mat-icon-button
          type="button"
          [attr.aria-label]="isFavorite(movie._id) ? 'Remove from favorites' : 'Add to favorites'"
          (click)="toggleFavorite(movie)"
        >
          <mat-icon *ngIf="!isFavorite(movie._id)">favorite_border</mat-icon>
          <mat-icon *ngIf="isFavorite(movie._id)" class="is-fav">favorite</mat-icon>
        </button>
        <div class="poster-card__overlay">
          <button type="button" (click)="openMovieView(movie.Title, movie.Description)">Info</button>
          <button type="button" (click)="openDirectorCard(movie.Director.Name, movie.Director.Bio)">Director</button>
          <button type="button" (click)="openGenreCard(movie.Genre.Name, movie.Genre.Description)">Genre</button>
        </div>
      </div>
      <h2 class="poster-card__title">{{ movie.Title }}</h2>
      <p class="poster-card__meta">{{ movie.Director.Name }}</p>
    </article>
  </div>
</section>
